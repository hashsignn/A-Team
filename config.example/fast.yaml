# Solution A — fast action. The delivery-first parameters.
#
# Everything the optimiser needs that cannot be derived from the shipment
# record lives here, so the pivot from "cheapest" to "fastest that still pays"
# is a file a planner can read and argue with rather than a constant in code.
#
# PROVENANCE: every rate carries `source`. `assumed` means we made it up to
# have something runnable; it must be shown as an assumption, not a fact.

# -------------------------------------------------------------------
# THE PROFITABILITY VETO
# -------------------------------------------------------------------
# Contribution = shipment value x rate. An option that would leave less than
# `margin_floor_chf` behind is discarded before ranking — never ranked lower,
# because a loss-making option is not a slow option, it is not an option.
margin_floor_chf: 0

gross_margin:
  default: {rate: 0.18, source: assumed}
  by_product_family:
    concrete_admixtures: {rate: 0.22, source: assumed}
    mortars:             {rate: 0.16, source: assumed}
    sealants_adhesives:  {rate: 0.28, source: assumed}
    roofing:             {rate: 0.19, source: assumed}
    flooring:            {rate: 0.24, source: assumed}
    waterproofing:       {rate: 0.21, source: assumed}

# -------------------------------------------------------------------
# HOW FAST THE NETWORK MOVES
# -------------------------------------------------------------------
# Door-to-door averages including the stops freight actually makes, not
# vehicle top speeds. Used by the contingency engine to cost an alternative
# path in HOURS, which is the currency the whole package ranks in.
transit:
  speed_kph:
    road:  {value: 62,  source: assumed}
    rail:  {value: 45,  source: assumed}
    barge: {value: 13,  source: assumed}
    sea:   {value: 31,  source: assumed}   # ~17 kn
  # Fixed time lost at each intermediate node: handling, documents, waiting
  # for a slot. Charged once per node passed through, not per leg.
  # What a kilometre costs by mode, for a consignment of typical size. Used
  # only to price a GENERATED alternative against the planned path; the
  # difference between the two is what the margin veto charges. Absolute
  # accuracy matters less than the ratios between modes, which are the thing
  # that decides whether trucking a barge load is affordable.
  cost_chf_per_km:
    road:  {value: 1.85, source: assumed}
    rail:  {value: 0.95, source: assumed}
    barge: {value: 0.42, source: assumed}
    sea:   {value: 0.11, source: assumed}
  # Charged once per intermediate node on a generated path: lift, storage,
  # documents. A path with more transfers is more expensive as well as slower.
  transfer_chf:
    default: {value: 420, source: assumed}

  # Keys are node kinds as network.yaml declares them.
  handling_hours:
    plant:        {value: 4,  source: assumed}
    distribution: {value: 3,  source: assumed}
    seaport:      {value: 18, source: assumed}
    inland_port:  {value: 10, source: assumed}
    customer:     {value: 2,  source: assumed}
    chokepoint:   {value: 0,  source: assumed}   # transited, not worked
    gauge:        {value: 0,  source: assumed}   # a measurement point
    default:      {value: 6,  source: assumed}

# -------------------------------------------------------------------
# PRE-CARRIAGE — how a container reaches the seaport
# -------------------------------------------------------------------
# Sika's export says which country ships to which and nothing about how the
# freight reaches its port: there is no mode column. So every realistic chain
# from the plant to the gateway port is priced with published figures, and
# the cheapest is the route the board draws — what a forwarder quoting the
# pre-carriage would do. engine/fast/precarriage.py does the sums;
# `scripts/simulate_precarriage.py` prints them, docs/ROUTES.md keeps them.
precarriage:
  payload_t: {value: 18, source: assumed, note: "a 40-foot container of packed chemicals"}
  gross_t: {value: 40, source: "the 40 t limit for an articulated truck in Switzerland and Germany"}
  # Real road distance over great-circle distance.
  circuity:
    value: 1.46
    source: >-
      Ballou, Rahardja and Sakai (2002), Selected country circuity factors for
      road travel distance estimation, Transportation Research Part A 36(9):
      the average for Europe. Applied to rail as well (assumed).
  # Operator cost per tonne-km under Swiss conditions: fuel or power, staff,
  # depreciation, insurance, maintenance. Tolls are added separately below.
  chf_per_tkm:
    road:  {value: 0.117, source: "ASNAV, Transportkostenvergleich Strasse–Schiene–Wasser (2021), Anhang 1"}
    rail:  {value: 0.026, source: "ASNAV (2021), Anhang 1"}
    barge: {value: 0.019, source: "ASNAV (2021), Anhang 1, including locks"}
  swiss_fee_chf_per_tkm: {value: 0.0239, source: "BAZG: LSVA for a Euro 6 truck, 2.39 Rp/tkm (2026), on the gross weight"}
  german_toll_eur_per_km: {value: 0.348, source: "Toll Collect: Euro VI, over 18 t, 5+ axles, CO2 class 1, since 1 July 2024"}
  italian_toll_eur_per_km: {value: 0.19034, source: "Autostrade per l'Italia: class 5 (5+ axles), plain-terrain rate (2026)"}
  eur_chf: {value: 0.94, source: assumed}
  # Within this fraction of the cheapest, costs are a tie at the precision of
  # the rates above, and the faster chain wins: two days less freight on the
  # water is worth more than a rounding difference.
  tie_fraction: {value: 0.05, source: assumed}
  # Places a chain passes that are not nodes on the board.
  points:
    KORNWESTHEIM: {lat: 48.87, lon: 9.18, name: "Kornwestheim rail terminal (DUSS), 6 km from the Stuttgart site"}
    MANNHEIM: {lat: 49.49, lon: 8.46, name: "Mannheim Rhine port"}
  # Every chain priced, per origin and gateway port. `km` overrides the
  # geometry where a river is involved: Rhine kilometres, not a sketch.
  # `swiss_km` / `german_km` are the tolled part of a road leg, estimated
  # from the motorway route; `all` means the whole leg.
  gateways:
    - origin: SIKA_DUD
      port: NLRTM
      lanes: [LANE_ASIA_08]
      chains:
        - id: truck
          legs: [{from: SIKA_DUD, to: NLRTM, mode: road, swiss_km: 130, german_km: 520}]
        - id: truck + barge
          legs: [{from: SIKA_DUD, to: CHBSL, mode: road, swiss_km: all},
                 {from: CHBSL, to: NLRTM, mode: barge, km: 870, via: GAUGE_KAUB}]
        - id: truck + rail
          legs: [{from: SIKA_DUD, to: CHBSL, mode: road, swiss_km: all},
                 {from: CHBSL, to: NLRTM, mode: rail}]
    - origin: SIKA_DUD
      port: BEANR
      lanes: [LANE_US_01, LANE_MX_01]
      chains:
        - id: truck
          legs: [{from: SIKA_DUD, to: BEANR, mode: road, swiss_km: 130, german_km: 440}]
        - id: truck + barge
          legs: [{from: SIKA_DUD, to: CHBSL, mode: road, swiss_km: all},
                 {from: CHBSL, to: BEANR, mode: barge, km: 900, via: GAUGE_KAUB}]
        - id: truck + rail
          note: "Swissterminal's Schweizerzug, Antwerp to Basel-Frenkendorf and Zurich-Niederglatt"
          legs: [{from: SIKA_DUD, to: CHBSL, mode: road, swiss_km: all},
                 {from: CHBSL, to: BEANR, mode: rail}]
    - origin: SIKA_DUD
      port: ITGOA
      lanes: [LANE_IN_01]
      chains:
        - id: truck
          note: "over the Simplon, then the A26 to Genoa"
          legs: [{from: SIKA_DUD, to: ITGOA, mode: road, swiss_km: 150, italian_km: 220}]
        - id: truck + rail
          note: "PSA and Swissterminal: Frenkendorf to Genoa-Pra', 3 a week, next-day arrival"
          legs: [{from: SIKA_DUD, to: CHBSL, mode: road, swiss_km: all},
                 {from: CHBSL, to: ITGOA, mode: rail}]
    - origin: SIKA_STU
      port: NLRTM
      lanes: [LANE_US_04]
      chains:
        - id: truck
          legs: [{from: SIKA_STU, to: NLRTM, mode: road, german_km: 470}]
        - id: truck + rail
          legs: [{from: SIKA_STU, to: KORNWESTHEIM, mode: road, german_km: 0},
                 {from: KORNWESTHEIM, to: NLRTM, mode: rail}]
        - id: truck + barge
          legs: [{from: SIKA_STU, to: MANNHEIM, mode: road, german_km: all},
                 {from: MANNHEIM, to: NLRTM, mode: barge, km: 610, via: GAUGE_KAUB}]

# -------------------------------------------------------------------
# THE CONTINGENCY SEARCH
# -------------------------------------------------------------------
contingency:
  # Stop expanding the graph past this; a path with more hops than this is
  # not something a planner will execute inside a disruption window.
  max_hops: 6
  # How many distinct alternatives to return. More than a handful is a menu,
  # and a menu is the clutter this rebuild exists to remove.
  max_paths: 3
  # A local vendor or 3PL is only worth calling if they are near enough to
  # reach the freight the same day.
  vendor_radius_km: 250
  # Assumed time for a local operator to take over: find them, agree terms,
  # get a vehicle to the load.
  vendor_handover_hours: {value: 6, source: assumed}
  # What a 3PL emergency takeover costs, as a fraction of consignment value,
  # plus a call-out fee. Deliberately expensive — it is a last resort, and the
  # margin veto should be the thing that decides, not an optimistic price.
  vendor_cost:
    callout_chf: {value: 2400, source: assumed}
    fraction_of_value: {value: 0.06, source: assumed}

# -------------------------------------------------------------------
# WHAT COUNTS AS FAST
# -------------------------------------------------------------------
# Bands for the single headline number on the dashboard. These are about the
# DECISION, not the delay: how long the planner has before the fastest
# surviving option stops being available.
urgency_bands:
  now:    2     # under 2 h of decision time left
  today:  12
  soon:   48
  # above soon: scheduled

# -------------------------------------------------------------------
# DISPATCH
# -------------------------------------------------------------------
# Where an executed action is announced. Nothing here is wired by default:
# every channel is disabled, and a disabled channel RECORDS the message it
# would have sent rather than pretending it went out.
dispatch:
  # Seconds before an executed action can no longer be pulled back. Instant
  # execution without a confirmation checklist is the mandate; this is what
  # makes that safe rather than reckless.
  undo_window_seconds: 900
  channels:
    - id: ops_webhook
      kind: webhook
      enabled: false
      url_env: RADAR_OPS_WEBHOOK_URL     # the NAME of the variable, never a value
      audience: [planner, ground_ops]
    - id: driver_socket
      kind: socket
      enabled: true                       # in-process fan-out, no egress
      audience: [driver, site_agent]
    - id: carrier_api
      kind: api
      enabled: false
      url_env: RADAR_CARRIER_API_URL
      audience: [carrier]
    - id: authority_notice
      kind: webhook
      enabled: false
      url_env: RADAR_AUTHORITY_WEBHOOK_URL
      audience: [authority]

# -------------------------------------------------------------------
# SUBSTITUTE CAPACITY — the constraint that makes a reroute real
# -------------------------------------------------------------------
# The contingency search finds a PATH. It says nothing about whether the
# vehicles to run it exist, and on a waterway derate that is the whole
# problem: 4flow's 2026 note puts a reference push barge at 2,450 t against
# 24 t a truck, so one barge is ~102 trucks, into a European market with
# roughly 500,000 unfilled driver positions (IRU 2026).
#
# An option that needs more units than the corridor has is not a fast option.
# It is a plan that does not happen.
#
# SCALE, STATED HONESTLY: Sika's intercompany export totals 775 t across
# eighteen months, so at THOSE volumes none of this binds — one barge could
# carry four years of it. It binds on their bulk admixture flows, which are
# not in the export. The numbers below are therefore declared, not derived,
# and `source:` says which is which.
capacity:
  # What one consignment weighs. Not from the export: its median document is
  # 3.7 kg, which describes samples and specialist product rather than the
  # bulk movements a barge carries. Replaceable the moment a bulk book exists.
  tonnes_per_consignment:
    default: {value: 22, source: assumed}
    by_product_family:
      concrete_admixtures: {value: 26, source: assumed}
      mortars:             {value: 28, source: assumed}
      waterproofing:       {value: 18, source: assumed}
      sealants:            {value: 12, source: assumed}
      adhesives:           {value: 12, source: assumed}
      flooring_resins:     {value: 16, source: assumed}
      roofing_membranes:   {value: 20, source: assumed}
      structural_bonding:  {value: 10, source: assumed}

  # Per corridor, per week. `units` is vehicles or sailings, not tonnes.
  modes:
    barge:
      tonnes_per_unit:   {value: 2450, source: "4flow 2026, reference push barge"}
      units_per_week:    {value: 6,    source: assumed}
      hours_to_ready:    {value: 48,   source: assumed}
      cost_chf_per_tonne: {value: 34,  source: assumed}
      carries: [liquids, bulk, industrial, packaged]
    rail:
      # ~20 wagons at 68 t. Slots are the constraint, not wagons.
      tonnes_per_unit:   {value: 1360, source: assumed}
      units_per_week:    {value: 4,    source: assumed}
      hours_to_ready:    {value: 72,   source: assumed}
      cost_chf_per_tonne: {value: 58,  source: assumed}
      carries: [bulk, industrial, packaged]
    road:
      tonnes_per_unit:   {value: 24,   source: "4flow 2026, 24 t per truck"}
      units_per_week:    {value: 210,  source: assumed}
      hours_to_ready:    {value: 12,   source: assumed}
      cost_chf_per_tonne: {value: 145, source: assumed}
      carries: [liquids, bulk, industrial, packaged]
      note: >
        The ceiling is the honest part. Europe had ~500,000 unfilled driver
        positions in 2026 (IRU), and every shipper on the corridor reaches for
        road at the same moment, so a derate does not release 210 trucks to
        whoever asks first.

  # Which product families need equipment a given mode may not have. 4flow's
  # point: "not every truck can move every load" — liquids want tank trailers,
  # bulk wants walking-floor or tipping equipment.
  equipment:
    liquids:   [sealants, adhesives, flooring_resins, structural_bonding]
    bulk:      [concrete_admixtures, mortars]
    industrial: [waterproofing, roofing_membranes]

  # Volume that can wait. Not everything displaced has to move now, and a
  # planner who triages is not failing — deferring the consignments with
  # slack is how the ones without it get capacity.
  defer:
    max_share: {value: 0.35, source: assumed}
