# Contacts and escalation ladder — SYNTHETIC, STRUCTURALLY REAL
#
# Every name, address and number below is invented. The STRUCTURE is not:
# roles, tiers, response SLAs and acknowledgement are how a real ladder works,
# and swapping in Sika's own directory is a file edit, not a code change.
#
# The four internal functions below are the ones Sika named in answer to Q6:
# "established teams that meet on a weekly schedule (e.g. Procurement,
# Manufacturing, Supply Chain, Controlling) increase meeting frequency ...
# They have full authority to decide on mitigation."
#
# That answer is why the ladder is short. The bottleneck is not authority.

internal:
  - id: FN_SUPPLY_CHAIN
    function: Supply Chain
    role: Lane owner — first responder
    tier: 1
    response_sla_hours: 2
    convene_member: true
    contact: "supply.chain.duty@example-synthetic.invalid"
    phone: "+41 00 000 00 01"

  - id: FN_PROCUREMENT
    function: Procurement
    role: Carrier relationship, rate and capacity authority
    tier: 1
    response_sla_hours: 4
    convene_member: true
    contact: "procurement.duty@example-synthetic.invalid"
    phone: "+41 00 000 00 02"

  - id: FN_MANUFACTURING
    function: Manufacturing
    role: Production re-sequencing, safety stock release
    tier: 2
    response_sla_hours: 8
    convene_member: true
    contact: "manufacturing.planning@example-synthetic.invalid"
    phone: "+41 00 000 00 03"

  - id: FN_CONTROLLING
    function: Controlling
    role: Cost approval above delegated limit
    tier: 2
    response_sla_hours: 8
    convene_member: true
    contact: "controlling.duty@example-synthetic.invalid"
    phone: "+41 00 000 00 04"

  - id: FN_CUSTOMER_SERVICE
    function: Customer Service
    role: Customer notification and commitment renegotiation
    tier: 1
    response_sla_hours: 2
    convene_member: false
    contact: "customer.service@example-synthetic.invalid"
    phone: "+41 00 000 00 05"

# Spend above which Controlling approval is required before acting.
# OPEN QUESTION for Sika: what is the real delegated limit, and who holds it?
# If the binding constraint turns out to be cost approval rather than
# awareness, this number is the most important one in the file.
approval:
  delegated_limit_chf: 10000
  approver: FN_CONTROLLING

