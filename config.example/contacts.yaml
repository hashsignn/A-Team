# ===================================================================
# SENIORS — escalation above the standing teams
# ===================================================================
# Keyed to the LADDER, not to a CHF figure, because the ladder is what the
# planner is already looking at. `from_level` is the least urgent rung at
# which this person is drawn in; anything more urgent includes them too.
#
# Sika's answer to Q6 says the standing teams already hold full authority
# once convened, so this list is deliberately short. It exists for the two
# cases authority does not cover: a decision above the delegated spend limit,
# and telling a customer their commitment will be missed.
seniors:
  - id: SNR_SUPPLY_CHAIN
    name: "A. Meier (synthetic)"
    role: "Head of Supply Chain"
    from_level: yellow
    why: "Owns the standing Supply Chain team and can convene it out of cycle."
    email: "head.supplychain@example-synthetic.invalid"
    phone: "+41 00 000 40 01"
  - id: SNR_PROCUREMENT
    name: "R. Dupont (synthetic)"
    role: "Head of Procurement"
    from_level: yellow
    why: "Releases spend above the delegated limit and opens spot capacity."
    email: "head.procurement@example-synthetic.invalid"
    phone: "+41 00 000 40 02"
  - id: SNR_OPERATIONS
    name: "S. Keller (synthetic)"
    role: "Regional Operations Director"
    from_level: red
    why: "Decides between missing a customer commitment and paying to recover it."
    email: "ops.director@example-synthetic.invalid"
    phone: "+41 00 000 40 03"

# Which standing teams a level draws in. Sika named these four as already
# meeting weekly and going daily in a crisis, with full authority to decide
# mitigation — so convening them IS the escalation, not a step before it.
convene_by_level:
  red:    [FN_SUPPLY_CHAIN, FN_PROCUREMENT, FN_MANUFACTURING, FN_CONTROLLING]
  yellow: [FN_SUPPLY_CHAIN, FN_PROCUREMENT, FN_CUSTOMER_SERVICE]
  blue:   [FN_SUPPLY_CHAIN, FN_PROCUREMENT]
  white:  [FN_SUPPLY_CHAIN]
  green:  []
