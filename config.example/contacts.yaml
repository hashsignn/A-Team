# -------------------------------------------------------------------
# Escalation ladder
# -------------------------------------------------------------------
# Escalation is by UNRESOLVED CHF at risk, not by the size of the external
# event. A large storm that threatens nothing does not escalate.
escalation:
  - level: 1
    trigger_chf: 0
    notify: [FN_SUPPLY_CHAIN]
    acknowledge_within_hours: 4
  - level: 2
    trigger_chf: 25000
    notify: [FN_SUPPLY_CHAIN, FN_PROCUREMENT, FN_CUSTOMER_SERVICE]
    acknowledge_within_hours: 4
  - level: 3
    trigger_chf: 100000
    notify: [FN_SUPPLY_CHAIN, FN_PROCUREMENT, FN_MANUFACTURING, FN_CONTROLLING]
    acknowledge_within_hours: 2
    note: "Convene rule normally trips at or before this level."

