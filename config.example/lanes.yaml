  # =================================================================
  # OVERSEAS LANES — added after reading Sika's own flow export
  #
  # The first lane set was built from the brief and covered 43% of Sika's
  # actual intercompany order volume. The rest went to markets with nowhere
  # to land: Mexico, India, Canada, Japan, Brazil, New Zealand, Australia,
  # South Africa, Colombia. An unroutable lane is invisible rather than
  # wrong, which is the more dangerous of the two.
  #
  # TRANSIT TIMES ARE COMPUTED, not guessed. Each leg is its real great-
  # circle or sea-waypoint distance divided by the modal speed in fast.yaml,
  # plus the handling time for the arrival node. The results land where
  # published container schedules do — Europe to India 13-18 days, to Japan
  # 30, to Auckland 35 — which is the check that the speed model is sane.
  #
  # WHAT IS STILL OURS, NOT SIKA'S: the port each market clears through, the
  # mode of each leg, and the buffer. The export carries country pairs and
  # nothing else, so these are declared and the inputs panel says so.
  # =================================================================
