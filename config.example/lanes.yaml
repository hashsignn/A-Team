# Lane definitions — SYNTHETIC
#
# A lane is a route template. A shipment instantiates a lane with real dates,
# a carrier, a value and a customer commitment.
#
# NOTE ON SCHEMA (deviation from BRIEF §3.3, deliberate):
# The brief's shipment schema carries only shipment-level `etd`/`eta`. The
# temporal gate (§5.1 condition 2) needs to know when the shipment is transiting
# *each* node, so every leg carries its own planned window and its own buffer.
# Without this the gate cannot be implemented as specified.
#
# transit_hours is the planned duration of the leg.
# buffer_hours is schedule slack that absorbs delay on that leg before it
# propagates (§5.2).

