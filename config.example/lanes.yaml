  # =================================================================
  # THE RHINE AS A LEG, NOT A DESTINATION
  #
  # LANE_RHINE_01 and _02 end at Rotterdam and Duisburg. Sika's export has
  # ZERO intercompany documents to the Netherlands or Germany, which does not
  # mean the Rhine is unimportant — it means those ports are TRANSIT in their
  # real flow, and modelling them as destinations put the corridor's whole
  # volume on lanes nobody ships.
  #
  # These are the through-lanes: Düdingen to the two biggest overseas markets,
  # routed north over the river instead of south over the Alps.
  #
  # WHICH WAY SIKA ACTUALLY SENDS IT IS NOT IN THE EXPORT. It carries country
  # pairs and nothing about routing. Both gateways are modelled — Rotterdam
  # via the Rhine here, Genoa over the Alps in LANE_ASIA_01 and LANE_IN_01 —
  # and the pair's real document count is SPLIT between them. That is a
  # declared assumption about how freight moves, not a finding from the data,
  # and it is made this way round deliberately: picking the Rhine because the
  # demo needs the Rhine is the exact fudge this calibration removed.
  # =================================================================
  - id: LANE_ASIA_08
    name: Düdingen → Basel → Rhine → Rotterdam → Suez → Shanghai
    focus: rhine
    legs:
      - from: SIKA_DUD
        to: CHBSL
        mode: road
        transit_hours: 11
        buffer_hours: 6
      - from: CHBSL
        to: GAUGE_KAUB
        mode: barge
        transit_hours: 25
        buffer_hours: 6
      - from: GAUGE_KAUB
        to: NLRTM
        mode: barge
        transit_hours: 45
        buffer_hours: 7
      - from: NLRTM
        to: CHOKE_SUEZ
        mode: sea
        transit_hours: 201
        buffer_hours: 30
      - from: CHOKE_SUEZ
        to: CHOKE_MALACCA
        mode: sea
        transit_hours: 280
        buffer_hours: 42
      - from: CHOKE_MALACCA
