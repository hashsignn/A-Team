# Fleet map — live asset status, rerouting, split loads and the partner network.
#
# PROVENANCE DISCIPLINE, as everywhere else in config/: every number carries a
# `source`. `client spec` means it came from the brief for the map layer;
# `assumed` means we picked it and it is the planning team's to argue with.
#
# Everything here is read by engine/fleet/. Nothing in this file changes the
# board, the ladder or the Monte Carlo: the map is a projection of numbers the
# board already computed, plus the one thing the board never had — geometry
# for the routes it did NOT plan.

# -------------------------------------------------------------------
# LIVE STATUS — the three colours on the map
# -------------------------------------------------------------------
# These are NOT the five-level ladder. The ladder answers "how soon must
# somebody decide"; this answers "how disrupted is this asset". Different
# question, so different tokens (--status-*), and the ladder colours stay
# reserved for the ladder.
#
# The input is the expected delay at destination from the worst single event
# touching the asset's remaining legs — the Monte Carlo's own do-nothing mean,
# not a new estimate.
status:
  colours:                       # source: client spec
    green: "#22c55e"             # nominal — on schedule
    yellow: "#eab308"            # minor disruption
    red: "#ef4444"               # major disruption / stoppage
  nominal_max_hours: 0.5         # source: assumed — below this a delay is schedule noise
  minor_max_hours: 4             # source: client spec — "< 4 hours delayed" is Yellow
  # A field report with one of these statuses is a stoppage, whatever the
  # model expects. Somebody looking at the freight outranks a forecast.
  stoppage_report_statuses: [held, stopped]
  damage_load_states: [damaged]

# Which shipments are on the map. Delivered freight is not an asset any more;
# freight booked for next month has no vehicle yet.
visibility:
  staging_window_hours: 72       # source: assumed — loading at origin within 3 days

# -------------------------------------------------------------------
# RATE CARD — prices the ROUTE, not the lever
# -------------------------------------------------------------------
# The board prices actions (engine/act/playbook.py) for the value-of-acting
# arithmetic. This prices the physical alternative — kilometres, vehicles,
# transfers — so that routes the playbook never planned can be compared on
# one basis. All values source: assumed.
modes:
  road:
    speed_kmh: 48                # over the clock, team driving, rest included
    detour_factor: 1.25          # road km over great-circle km
    chf_per_vehicle_km: 2.10
    teu_per_vehicle: 2
    baseline_risk: 0.06
  rail:
    speed_kmh: 34
    detour_factor: 1.20
    chf_per_teu_km: 0.42
    baseline_risk: 0.05
  barge:
    speed_kmh: 11
    detour_factor: 1.00          # river geometry is already the river
    chf_per_teu_km: 0.22
    baseline_risk: 0.07
  sea:
    speed_kmh: 31                # ~17 kn
    detour_factor: 1.00          # sea-lane geometry is already the lane
    chf_per_teu_km: 0.06
    baseline_risk: 0.06

transfer:
  hours: 6                       # source: assumed — crane / cross-dock at a terminal
  chf_per_teu: 160               # source: assumed
  risk: 0.03                     # source: assumed — every handover is a chance to lose time

# Which lever each kind of alternative needs, for its setup time. A rail
# switch cannot start moving the freight until the path is booked; that time
# is added to the route rather than ignored.
levers:
  inland_to_road: road_reroute
  inland_to_rail: barge_to_rail_switch
  road_detour: road_reroute
  sea_bypass: sea_reroute
  port_swap: sea_rebook

# -------------------------------------------------------------------
# RANKING — Time, Cost, Risk
# -------------------------------------------------------------------
# Each candidate is min-max normalised against the others AND the original
# route, then weighted. Lower is better. The weights are the planner's to
# set; the map exposes them and so does the agent hook.
ranking:
  weights: {time: 0.5, cost: 0.3, risk: 0.2}   # source: assumed
  badges: 3                                     # source: client spec — #1, #2, #3
  risk_labels:                                  # source: assumed
    - {max: 0.25, label: Low}
    - {max: 0.50, label: Medium}
    - {max: 1.01, label: High}
  severity_weight: {minor: 0.35, moderate: 0.60, severe: 0.85}   # source: assumed

# -------------------------------------------------------------------
# THE ACTION HUB CHARTS
# -------------------------------------------------------------------
# The radar's five axes are the client's; which ledger families feed each is
# ours. Labour sits under Geopolitics because the ledger's labour variables are
# industrial action — a political act, not a congestion statistic.
radar:
  axes:                                   # source: client spec
    - {key: weather, label: Weather, families: [climate, force_majeure]}
    - {key: geopolitics, label: Geopolitics, families: [geopolitical, labour]}
    - {key: port_congestion, label: Port Congestion, families: [port_ops, capacity, cyber]}
    - {key: route_infrastructure, label: Route Infrastructure, families: [infrastructure, waterway]}
    - {key: mechanical, label: Mechanical Status, families: [mechanical]}
  # Index = 100 x (1 - exp(-hours / scale)). 24 h of expected delay reads 63.
  scale_hours: 24                         # source: assumed

# 5 x 5, probability against the bill IF late — the board's own two axes,
# banded finer. An unsourced probability goes in a gutter, never at a band.
matrix:
  probability_bands:                      # P(this shipment is late)
    - {id: P1, label: Rare, max_p: 0.2}
    - {id: P2, label: Unlikely, max_p: 0.4}
    - {id: P3, label: Possible, max_p: 0.6}
    - {id: P4, label: Likely, max_p: 0.8}
    - {id: P5, label: Almost certain, max_p: 1.01}
  impact_bands:                           # CHF if late, most severe first
    - {id: I5, label: Severe, min_chf: 100000}
    - {id: I4, label: Major, min_chf: 40000}
    - {id: I3, label: Moderate, min_chf: 10000}
    - {id: I2, label: Minor, min_chf: 2000}
    - {id: I1, label: Negligible, min_chf: 0}

# -------------------------------------------------------------------
# ROAD GEOMETRY — OSRM, optional
# -------------------------------------------------------------------
# Only called when RADAR_ALLOW_NETWORK=1, like every other outbound request.
# Without it, road legs are drawn on the corridor estimate and say so.
# Point `url` at a self-hosted OSRM for anything beyond a demo: the public
# server is a courtesy with a fair-use policy, not a service.
routing:
  osrm_url: "https://router.project-osrm.org"
  timeout_s: 4

# -------------------------------------------------------------------
# BASEMAP — served to the browser, never fetched by the server
# -------------------------------------------------------------------
# OpenStreetMap raster tiles, desaturated in the renderer so routes and
# assets are the brightest things on screen. With no network the map draws
# the vendored country outlines instead and says so.
basemap:
  tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
  attribution: "© OpenStreetMap contributors"
  max_zoom: 18

