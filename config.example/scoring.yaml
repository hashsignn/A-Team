# Scoring, actionability, cost model and the convene rule.

# -------------------------------------------------------------------
# MONTE CARLO
# -------------------------------------------------------------------
simulation:
  draws: 10000
  seed: 20260918
  # Event durations are drawn ONCE PER ITERATION into an (draws x events)
  # matrix and that same draw is applied to every shipment the event gates.
  # Drawing per shipment would model 40 independent strikes at one port and
  # would destroy the tail — which is the quantity the convene decision
  # depends on. See engine/simulate/draws.py.
  portfolio_correlated: true

# -------------------------------------------------------------------
# COST MODEL
# -------------------------------------------------------------------
# DEVIATION from BRIEF §5.4, deliberate. The brief has
#     E[loss|nothing] = penalty_per_day x E[delay] + P(late) x customer_cost
# Two problems:
#   1. E[delay] is delay against the PLANNED eta. Penalty accrues against the
#      COMMITTED date. Those differ by the commitment slack, so the brief's
#      formula charges penalty for lateness that never happened.
#   2. max(0, .) is convex, so it must be evaluated inside the expectation,
#      not applied to the mean. Both are fixed in engine/score/impact.py.
#
# Sika has not confirmed that per-day contractual penalties exist in their
# customer contracts (open question). The model therefore has THREE additive
# components so the number stays non-zero and defensible even when the
# contractual penalty is zero.
cost:
  components:
    contractual_penalty:
      enabled: true
      # CHF per day late, taken from the shipment record where present.
      source: shipment.sla_penalty_per_day

    expediting:
      enabled: true
      # What it costs to recover time once late: premium transport, overtime
      # handling, partial airfreight of the critical subset.
      # Applied once if the shipment is late at all, scaled by value band.
      chf_per_event_by_value_band:
        low: 800
        mid: 2500
        high: 7000

    customer_impact:
      enabled: true
      # Categorical, set by the planner per customer, NOT derived.
      # This is the term that survives when no contractual penalty exists.
      chf_by_tier:
        line_down: 45000      # customer production stops
        stock_out: 12000      # customer runs out, no stoppage yet
        inconvenience: 2000   # annoyance, no operational consequence
      default_tier: stock_out

  value_bands:
    low: 20000       # < CHF 20k
    mid: 100000      # CHF 20k - 100k
    # above mid = high

# -------------------------------------------------------------------
# ACTIONABILITY — BRIEF §5.5
# -------------------------------------------------------------------
# Minimum hours needed to execute an action. Below this the option is gone.
# These are the cliff edges of the option-decay curve.
min_action_hours:
  sea_reroute: 72
  sea_rebook: 72
  rail_rebook: 24
  rail_reroute: 24
  barge_to_rail_switch: 36
  barge_part_load: 24
  road_reroute: 4
  add_buffer: 12
  reserve_capacity: 48
  expedite: 12
  notify_customer: 1
  escalate_carrier: 2

# lead_time / action_duration ratio -> posture
actionability_bands:
  comfortable: 2.0    # lead > 2x duration
  tightening: 1.0     # 1x - 2x
  # below 1x: too late. Stop proposing reroutes, switch to notification.

# -------------------------------------------------------------------
# RISK MATRIX BANDS — BRIEF §5.7
# -------------------------------------------------------------------
matrix:
  impact_bands:
    - {id: A, label: ">100k", min_chf: 100000, action: "ESCALATE — reroute now"}
    - {id: B, label: "10-100k", min_chf: 10000, action: "CONTINGENCY — reserve carrier"}
    - {id: C, label: "1-10k", min_chf: 1000, action: "MITIGATE — buffer / minor"}
    - {id: D, label: "<1k", min_chf: 0, action: "MONITOR"}
  probability_bands:
    - {id: P1, label: "0-0.25", max_p: 0.25}
    - {id: P2, label: "0.25-0.5", max_p: 0.50}
    - {id: P3, label: "0.5-0.75", max_p: 0.75}
    - {id: P4, label: "0.75-1.0", max_p: 1.01}
  # Events whose probability cannot be sourced are NOT placed on the
  # probability axis. They go in a separate band drawn outside the grid.
  # BRIEF §8.1: an absence must never become a value.
  # Worded for somebody who has never read this file. "P unsourced" is
  # exact and unreadable: it made a planner ask what the column was, which
  # is a column doing the opposite of its job.
  unsourced_band_label: "no odds published"

# -------------------------------------------------------------------
# THE CONVENE RULE — answers Sika Q6
# -------------------------------------------------------------------
# Sika: "The real problem is that we declare a crisis too late and lose on
# available options." Teams already hold full authority once convened; the
# failure is the decision to convene.
#
# The tool does not argue for a crisis. It reports that a threshold the group
# agreed IN ADVANCE, in calm conditions, has tripped. That moves the decision
# from a judgement one person has to own to a rule the group already owns.
#
# These numbers are placeholders until the planning team sets them.
convene_rule:
  agreed_on: null            # date the team signed off; null = not yet agreed
  agreed_by: null
  meeting_cadence_days: 7    # weekly, per Sika Q6
  escalated_cadence_days: 1  # daily once convened

  thresholds:
    # CHANGED: this was `recoverable_chf`, the summed value of acting across
    # the book. That number comes from our invented action costs and residual
    # fractions — the least defensible arithmetic in the system — and a crisis
    # rule whose primary trigger is a number nobody can stand behind is a
    # broken rule, not a conservative one.
    #
    # Exposure is expected loss straight out of the Monte Carlo. It is the
    # figure already shown on the board, so the rule now trips on something a
    # planner can see and check.
    exposure_chf: 150000

    # Trip if more than this many distinct customer contracts are exposed.
    contracts_exposed: 4

    # How many shipments are inside the Alert window (48 h to the decision
    # deadline). Plain supply chain: a cutoff to get a box to the terminal or
    # book the last train path — not an option with a strike price. The
    # earlier version of this trigger priced "expiring options", which
    # borrowed a framing from finance that does not belong in a freight
    # planner's hands; the timing it was reaching for is already carried by
    # the five-level ladder, where every rung IS a deadline.
    shipments_needing_decision: 8

  # Posture thresholds for the state strip, as a fraction of the trip level.
  watch_fraction: 0.5

# -------------------------------------------------------------------
# PORTFOLIO DECAY CURVE
# -------------------------------------------------------------------
decay_curve:
  horizon_days: 21
  step_hours: 6
  # The sum of per-shipment value-of-acting is a CEILING: it assumes every
  # action could be taken at once, which ignores contention for the same
  # alternate capacity. Cap the number of concurrent actions counted.
  concurrent_action_cap: 12

# -------------------------------------------------------------------
# THE FIVE-LEVEL INDICATOR LADDER
# -------------------------------------------------------------------
# Every rung of the client's scale is phrased as a DEADLINE, not as a damage
# band. So the level is a function of how soon somebody must decide — which is
# lead_time_hours, already computed from
#     decision_deadline = impact_time - action_duration
#
#   GREEN   Normal    no action is required
#   WHITE   Bias      monitor closely, pay attention to changes
#   BLUE    Watch     action determined within 3-7 days
#   YELLOW  Alert     action taken within 24-48 hours
#   RED     Critical  action taken within 6 hours
#
# The hour cutoffs are the client's own numbers. The two values marked ASSUMED
# are ours and are the ones to replace when the real severity formula arrives.
alert_levels:
  red_hours: 6        # client's wording: "within 6 hours"
  yellow_hours: 48    # client's wording: "within 24-48 hours"
  blue_hours: 168     # client's wording: "within 3-7 days"

  # ASSUMED — the floor below which a touched route is White (monitor) rather
  # than Blue (decide). Without it every route with any event at all demands a
  # decision, which is the crying-wolf failure the tool exists to prevent.
  material_chf: 1000

  # ASSUMED — ranking within a level is by CHF exposure. Lexicographic: the
  # rung always wins, and money only breaks ties inside it.
  rank_within_level_by: exposure_chf

# =====================================================================
# URGENCY COMPRESSION — the severity formula
# =====================================================================
# The ladder above is a TIME-TO-ACT scale, so severity is "how soon must
# somebody decide", not "how bad is this". The raw answer is the clock:
#
#     tau = decision_deadline - as_of
#
# On its own that under-serves the question. Two routes both a week out score
# identically whether CHF 900 or CHF 225,000 sits on them — which is exactly
# the failure Sika named in Q6: a large, slow-building exposure stays in
# "monitor" until suddenly it is not, and by then the options are gone.
#
# So magnitude COMPRESSES the clock rather than replacing it:
#
#     tau_effective = tau / U
#     U = 1 + w_magnitude*M + w_likelihood*L + w_irreversible*D
#
# and tau_effective is classified against the CLIENT'S OWN 6/48/168. Their
# thresholds are never touched, which matters: re-tuning them would make the
# ladder ours instead of theirs.
#
# ADDITIVE, NOT MULTIPLICATIVE. A product of [0,1] factors collapses toward
# zero as dimensions are added, so the model would get quieter the more it
# was taught. A bounded sum cannot, and each term stays independently
# inspectable — you can ask which one moved a route and get an answer.
urgency:
  enabled: true

  # ASSUMED — how hard each term pulls. They are the arguable numbers in this
  # file and they belong to the planning team.
  #
  # THE CAP IS NOT A TASTE CALL. U_max = 1 + sum(weights) must stay BELOW the
  # smallest ratio between adjacent thresholds — here min(168/48, 48/6) = 3.5
  # — because that is what makes a single compression unable to advance more
  # than one rung. Money may make you decide sooner; it must never
  # manufacture a six-hour emergency out of a week of slack. A test asserts
  # this against the live thresholds, so changing either side fails loudly.
  weights:
    magnitude: 0.8      # CHF exposure, log-scaled
    likelihood: 0.4     # P(late) of the binding shipment
    irreversible: 0.8   # cargo that cannot be saved by arriving later

  # The exposure at which the magnitude term saturates. Reuses the convene
  # threshold rather than inventing a number: "big enough to pull the team
  # out of their weekly cycle" is the same notion of big.
  magnitude_reference_chf: 150000

  # Near a boundary ANY continuous modifier tips — 176 h with CHF 2,000 still
  # crosses 168. A dead-band requires the compressed time to clear the next
  # threshold by this fraction before it re-levels, so a marginal nudge does
  # not churn a route between rungs on successive runs.
  # ASSUMED. Set to 0.0 to disable.
  dead_band: 0.10

# =====================================================================
# CORROBORATION — what a single uncorroborated source may do
# =====================================================================
# Sika, answering Q5: factor in social media, in line with the corroboration
# threshold. Social media is not a BETTER signal, it is an EARLIER one, and
# its whole value is arriving while there is still time to act.
#
# So it may raise a flag; it may not on its own move a delivery date. An
# uncorroborated tier-3 report caps at the rung below "act within 48 hours",
# and a second independent source lifts the cap.
corroboration:
  # ASSUMED — the cap, as a level name.
  uncorroborated_tier3_cap: blue
  # How many independent tier-3 sources count as corroboration on their own.
  tier3_sources_for_corroboration: 2
  # A tier at or below this needs no corroboration: an authority notice is
  # the record, not a claim about it.
  authoritative_tier_at_or_below: 2
