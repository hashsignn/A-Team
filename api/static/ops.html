<body class="ops-page">

<!-- ============================================================
     ONE CONSOLE, NOT THREE TABS

     It was Playbook / Consignments / Execute: a checklist, a table, and a
     third surface for one shipment. The consignments belong to the step that
     asks which consignments are affected, and executing belongs to the step
     that chooses what to do — splitting them into tabs meant the step and
     the thing it needed were never on screen together.

     Every step below carries its own controls. Nothing here is a box you
     tick to assert you did something elsewhere.
     ============================================================ -->

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1 id="ops-title">Operations</h1>
      <p class="brand-sub" id="brand-sub">loading…</p>
    </div>
  </div>
  <div class="prof-head-right">
    <nav class="themes" id="themes" aria-label="Colour theme"></nav>
    <a class="ctl" id="link-lane" href="#">Lane page</a>
    <a class="ctl" href="/">&larr; Back to the radar</a>
  </div>
</header>

<!-- The rail. Full width, four segments, one per stage, each filling with
     its own progress — so "where am I in this" is answered by the shape of
     the bar rather than by counting ticks down the page. -->
<div class="rail" id="rail" aria-label="Progress through the response"></div>

<main class="cons-main" id="console">
  <p class="cons-loading">Opening the lane…</p>
</main>

<script src="/console.js?v=__ASSETV__"></script>
</body>
</html>
