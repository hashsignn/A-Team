[project]
name = "sika-risk-radar"
version = "0.1.0"
description = "Supply Chain Risk Radar — external risk on the lanes you actually use"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
